<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arda Mecik | System Programmer</title>
    <style>
        body {
            background-color: #0d1117; /* GitHub Dark Dimmed */
            color: #39d353; /* GitHub Green */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            font-size: 16px;
            overflow-x: hidden;
        }

        #terminal {
            max-width: 900px;
            margin: 0 auto;
        }

        .output-line {
            margin-bottom: 5px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .prompt {
            color: #2f81f7; /* GitHub Blue */
            margin-right: 10px;
            font-weight: bold;
        }

        #cmdInput {
            background: transparent;
            border: none;
            color: #e6edf3; /* White-ish */
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
            caret-color: #39d353;
        }

        .error { color: #f85149; } /* GitHub Red */
        .highlight { color: #d2a8ff; font-weight: bold; } /* GitHub Purple */
        .comment { color: #8b949e; font-style: italic; } /* GitHub Grey */
        
        a { color: #58a6ff; text-decoration: none; border-bottom: 1px dashed #58a6ff; }
        a:hover { background-color: #1f6feb; color: white; }

        /* Scanline effect for retro feel */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="history"></div>
        <div class="input-line">
            <span class="prompt">arda@root:~/portfolio$</span>
            <input type="text" id="cmdInput" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const cmdInput = document.getElementById('cmdInput');
        const history = document.getElementById('history');

        const asciiArt = `
    _            _         __  __           _ _    
   / \\   _ __ __| | __ _  |  \\/  | ___  ___(_) | __
  / _ \\ | '__/ _\` |/ _\` | | |\\/| |/ _ \\/ __| | |/ /
 / ___ \\| | | (_| | (_| | | |  | |  __/ (__| |   < 
/_/   \\_\\_|  \\__,_|\\__,_| |_|  |_|\\___|\\___|_|_|\\_\\
                                                   
>> System Programmer | Computer Engineering Student
>> Location: Turkiye (Open for Amsterdam)
>> Status: Online
---------------------------------------------------
Type 'help' to see available commands.
`;

        window.onload = function() {
            printLine(asciiArt, 'highlight');
        };

        cmdInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const command = cmdInput.value.trim().toLowerCase();
                if (command) {
                    printLine('arda@root:~/portfolio$ ' + command, 'prompt');
                    processCommand(command);
                }
                cmdInput.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        // Click anywhere to focus input
        document.addEventListener('click', () => cmdInput.focus());

        function printLine(text, className = '') {
            const div = document.createElement('div');
            div.className = 'output-line ' + className;
            div.innerHTML = text;
            history.appendChild(div);
        }

        function processCommand(cmd) {
            switch (cmd) {
                case 'help':
                    printLine(`
  <span class="highlight">AVAILABLE COMMANDS:</span>
  
  <span class="highlight">whoami</span>    : Detailed bio & education
  <span class="highlight">skills</span>    : Technical stack (Low-level & High-level)
  <span class="highlight">projects</span>  : My works (C, Assembly, VHDL)
  <span class="highlight">contact</span>   : Email, LinkedIn, GitHub
  <span class="highlight">cv</span>        : View my Europass Resume
  <span class="highlight">clear</span>     : Clear the terminal
`);
                    break;

                case 'whoami':
                    printLine(`
  <span class="highlight">USER PROFILE:</span>
  
  Name:      Arda Mecik
  Role:      Computer Engineering Student (2nd Year)
  School:    Trakya University, Edirne
  Focus:     Low-Level Programming & Embedded Systems
  
  <span class="comment">// Bio</span>
  I have been coding actively since middle school. Unlike many, 
  I prefer the "engine room" of the machine over the frontend. 
  I specialize in C, Assembly, and digital logic.
  
  Currently seeking internship opportunities in <span class="highlight">Amsterdam</span>.
`);
                    break;

                case 'skills':
                    printLine(`
  <span class="highlight">TECHNICAL ARSENAL:</span>

  [LOW-LEVEL & SYSTEM]
  > C / C++              : Advanced
  > Assembly 8086        : Proficient
  > VHDL (Quartus)       : Proficient
  > Digital Logic Design : Academic Focus
  
  [APPLICATION & WEB]
  > C#                   : Intermediate
  > HTML / CSS / JS      : Intermediate
  
  [CORE CONCEPTS]
  > Data Structures & Algorithms
  > Linear Algebra & Engineering Physics
  > Analytical Strategy
`);
                    break;

                case 'projects':
                    printLine(`
  <span class="highlight">ACTIVE PROJECTS:</span>

  1. <span class="highlight">Custom C Disassembler</span>
     Decodes binary machine code into human-readable assembly instructions.
     Demonstrates deep understanding of memory layout and instruction sets.
     [Tech: C, Hex Analysis]

  2. <span class="highlight">8086 Assembly System</span>
     Low-level memory management and processor instruction handling.
     Direct hardware interaction simulation.
     [Tech: Assembly 8086]

  3. <span class="highlight">Digital Logic Design (VHDL)</span>
     Circuit design and simulation using Quartus Altera.
     Focus on FPGA logic and hardware description.
     [Tech: VHDL, Quartus]
`);
                    break;

                case 'contact':
                    printLine(`
  <span class="highlight">CONNECT WITH ME:</span>
  
  Email:    <a href="mailto:mecikarda@gmail.com">mecikarda@gmail.com</a>
  LinkedIn: <a href="https://www.linkedin.com/in/arda-me%C3%A7ik-8a8538385" target="_blank">linkedin.com/in/arda-mecik</a>
  GitHub:   <a href="https://github.com/mecik-arda" target="_blank">github.com/mecik-arda</a>
`);
                    break;

                case 'cv':
                    printLine('Redirecting to Europass Profile...', 'comment');
                    setTimeout(() => {
                        window.open('https://europa.eu/europass/eportfolio/api/eprofile/shared-profile/arda-me%C3%A7ik/c4304e18-c3a6-4779-a3f0-587f525e8dbe?view=html', '_blank');
                    }, 1000);
                    break;

                case 'clear':
                    history.innerHTML = '';
                    break;

                default:
                    printLine(`Command not found: '${cmd}'. Type <span class="highlight">'help'</span> for list.`, 'error');
            }
        }
    </script>
</body>
</html>
